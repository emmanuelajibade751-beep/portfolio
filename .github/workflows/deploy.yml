name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Only one deploy at a time; a newer push cancels an in-flight one rather
# than racing it (GitHub's recommended concurrency group for Pages).
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        # Handles npm install + astro build + astro check, and uploads
        # dist/ as a Pages artifact — the `site`/`base` in astro.config.mjs
        # already point at this repo's GitHub Pages URL.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
